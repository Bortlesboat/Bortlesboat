name: Wallet policy kit

on:
  pull_request:
    paths:
      - 'bitcoin-research/experiments/prepared-checkout/**'
      - 'bitcoin-research/site/**'
      - '.github/workflows/wallet-policy.yml'
  push:
    branches: [main]
    paths:
      - 'bitcoin-research/experiments/prepared-checkout/**'
      - 'bitcoin-research/site/**'
      - '.github/workflows/wallet-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Audit the recorded transactions and failure controls
        working-directory: bitcoin-research/experiments/prepared-checkout
        run: python -m unittest -v test_policy test_runner test_integration

  publish:
    name: Publish project page
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: wallet-policy-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: bitcoin-research/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
